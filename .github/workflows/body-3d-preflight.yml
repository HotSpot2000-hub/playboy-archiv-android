          ROOT = Path('model-preflight')
          ROOT.mkdir(exist_ok=True)
          REPORT = {'scope': 'Synthetic CPU/export test; no photos, no Android benchmark, no measurements.',
                    'android_verified': False, 'measurement_accuracy_verified': False, 'test_revision': 9, 'stages': []}
          
          def download(url, target, max_bytes):
              known = {'instanthmr.onnx': 'f717558094f57d7c9cd084d7981874dbcc3f08e7308501eb98c12844e2cce3b7',
                       'mhr_j127_to_kp70.npy': 'd0a64adcec183a892167ea1df1657a8c819fcddbc721f6b8a46f6336ea90292a',
                       'InstantHMR-SOURCE-LICENSE.txt': 'ac522c297992539ad2ef77b6780c1d5456e4194ff9109767cf54032aa6fe2f8a',
                       'mhr-assets.zip': 'e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94'}
              if target.exists() and target.name in known:
                  with target.open('rb') as cached:
                      fingerprint = hashlib.file_digest(cached, 'sha256').hexdigest()
                  if fingerprint == known[target.name]:
                      return {'url': url, 'bytes': target.stat().st_size, 'sha256': fingerprint, 'verified_cache': True}
              request = urllib.request.Request(url, headers={'User-Agent': 'PlayboyArchiv-3D-Preflight/1.0'})
              count = 0
              digest = hashlib.sha256()
              with urllib.request.urlopen(request, timeout=60) as response, target.open('wb') as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > max_bytes:
                          raise RuntimeError('Download exceeds diagnostic size limit')
                      output.write(chunk)
                      digest.update(chunk)
              if not count:
                  raise RuntimeError('Empty download')
              expected = {
                  'instanthmr.onnx': 'f717558094f57d7c9cd084d7981874dbcc3f08e7308501eb98c12844e2cce3b7',
                  'mhr_j127_to_kp70.npy': 'd0a64adcec183a892167ea1df1657a8c819fcddbc721f6b8a46f6336ea90292a',
                       'InstantHMR-SOURCE-LICENSE.txt': 'ac522c297992539ad2ef77b6780c1d5456e4194ff9109767cf54032aa6fe2f8a',
                       'mhr-assets.zip': 'e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94',
              }.get(target.name)
              if expected and digest.hexdigest() != expected:
                  raise RuntimeError('Download checksum differs from verified first run')
              return {'url': url, 'bytes': count, 'sha256': digest.hexdigest()}
          
          def flush():
              (ROOT / 'report.json').write_text(json.dumps(REPORT, indent=2), encoding='utf-8')
              lines = ['# 3D-Techniktest', '', 'Nur künstliche Eingaben. Keine Archivfotos, keine Körpermaße.', '',
                       '| Stufe | Ergebnis |', '|---|---|']
              for row in REPORT['stages']:
                  lines.append('| ' + row['name'] + ' | ' + row['status'] + ' |')
              lines += ['', '**Android auf dem S25: nicht getestet. Maßgenauigkeit: nicht getestet.**', '',
                        'Details und Fehler stehen in report.json. Ein grüner Lauf belegt nur diese CPU-/Exportprüfungen.']
              (ROOT / 'report.md').write_text('\n'.join(lines), encoding='utf-8')
          
          
          def stage(name, fn):
              row = {'name': name, 'status': 'running'}
              REPORT['stages'].append(row)
              flush()
              try:
                  row['details'] = fn()
                  row['status'] = 'passed'
                  print(json.dumps(row, ensure_ascii=False), flush=True)
              except Exception as error:
                  row['status'] = 'failed'
                  row['error'] = str(error)
                  print(json.dumps(row, ensure_ascii=False), flush=True)
                  row['traceback'] = traceback.format_exc()
                  raise
              finally:
                  flush()
          
          
          def add_decoder_points(target,weights):
              model=onnx.load(str(target))
              if weights.shape!=(70,127) or not np.isfinite(weights).all():raise RuntimeError('Invalid pinned keypoint map')
              stacks=[n for n in model.graph.node if n.op_type=='Concat' and len(n.input)==127 and any(a.name=='axis' and a.i==1 for a in n.attribute)]
              if len(stacks)!=1:raise RuntimeError('Skeleton state stack not uniquely identifiable')
              casts=[n for n in model.graph.node if n.op_type=='Cast' and list(n.input)==list(stacks[0].output) and any(a.name=='to' and a.i==onnx.TensorProto.FLOAT for a in n.attribute)]
              if len(casts)!=1:raise RuntimeError('Float skeleton state not uniquely identifiable')
              state=casts[0].output[0];prefix='body3d_decoder_points_'
              if any(name.startswith(prefix) for n in model.graph.node for name in n.output):raise RuntimeError('Duplicate decoder point outputs')
              old_nodes=[n.SerializeToString() for n in model.graph.node];old_initializers=[x.SerializeToString() for x in model.graph.initializer]
              def constant(name,value):
                  name=prefix+name;model.graph.initializer.append(onnx.numpy_helper.from_array(value,name));return name
              start=constant('start',np.array([0],np.int64));end=constant('end',np.array([3],np.int64));axis=constant('axis',np.array([2],np.int64))
              scale=constant('vision_scale',np.array([.01,-.01,-.01],np.float32));matrix=constant('map',weights.astype(np.float32))
              model.graph.node.extend([
                  onnx.helper.make_node('Slice',[state,start,end,axis],[prefix+'raw'],name=prefix+'slice'),
                  onnx.helper.make_node('Mul',[prefix+'raw',scale],[prefix+'vision'],name=prefix+'convert'),
                  onnx.helper.make_node('MatMul',[matrix,prefix+'vision'],['decoder_joints'],name=prefix+'regress')])
              model.graph.output.append(onnx.helper.make_tensor_value_info('decoder_joints',onnx.TensorProto.FLOAT,[1,70,3]))
              if old_nodes!=[n.SerializeToString() for n in model.graph.node[:len(old_nodes)]] or old_initializers!=[x.SerializeToString() for x in model.graph.initializer[:len(old_initializers)]]:raise RuntimeError('Original mesh graph modified')
              onnx.checker.check_model(model);onnx.save(model,str(target))

          def export_pose_only(target, destination):
              model = onnx.load(str(target))
              needed = {'decoder_joints'}
              kept = []
              for node in reversed(model.graph.node):
                  if any(name in needed for name in node.output):
                      kept.append(node)
                      needed.update(node.input)
              graph = onnx.helper.make_graph(list(reversed(kept)), 'body3d_pose_only',
                  [v for v in model.graph.input if v.name in needed],
                  [onnx.helper.make_tensor_value_info('decoder_joints', onnx.TensorProto.FLOAT, [1, 70, 3])],
                  initializer=[v for v in model.graph.initializer if v.name in needed])
              result = onnx.helper.make_model(graph, opset_imports=model.opset_import)
              result.ir_version = model.ir_version
              onnx.checker.check_model(result)
              onnx.save(result, str(destination))
              if destination.stat().st_size > 5 * 1024**2:
                  raise RuntimeError('Pose-only decoder size regression')

          def main():
              import numpy as np
              import onnx
              import onnxruntime as ort
              ort.disable_telemetry_events()
              import torch
              torch.set_num_threads(2)
              REPORT['environment'] = {'python': platform.python_version(), 'torch': torch.__version__,
                                       'onnx': onnx.__version__, 'onnxruntime': ort.__version__}
              flush()
              revision = '3504446fc31e7f76fdb1cd7e463189e7cf0fdd0f'
              regressor_path = ROOT / 'instanthmr.onnx'
              stage('Download Bildmodell', lambda: download(
                  f'https://huggingface.co/momolesang/InstantHMR/resolve/{revision}/instanthmr.onnx',
                  regressor_path, 512 * 1024**2))
              source_regressor_path = regressor_path
              regressor_path = ROOT / 'instanthmr-fp32.onnx'
          
              def prepare_fp32_regressor():
                  converted = promote_regressor(source_regressor_path, regressor_path)
                  return {'source_precision': 'float16 internal', 'compute_precision': 'float32',
                          'weight_values_preserved': True, 'bytes': regressor_path.stat().st_size,
                          'converted': converted}
              stage('Bildmodell für FP32-Ausführung vorbereiten', prepare_fp32_regressor)
              options = ort.SessionOptions()
              options.intra_op_num_threads = 2
              options.add_session_config_entry('mlas.enable_gemm_fastmath_arm64_bfloat16', '0')
              options.add_session_config_entry('optimization.enable_gelu_approximation', '0')
              regressor = None
              predictions = None
          
              def check_regressor():
                  nonlocal regressor, predictions
                  regressor = ort.InferenceSession(str(regressor_path), sess_options=options,
                                                  providers=['CPUExecutionProvider'])
                  inputs = {item.name: item for item in regressor.get_inputs()}
                  if set(inputs) != {'image', 'cliff_cond'}:
                      raise RuntimeError(f'Unexpected inputs: {list(inputs)}')
                  feeds = {'image': np.zeros((1, 3, 224, 224), np.float32),
                           'cliff_cond': np.array([[0., 0., .8]], np.float32)}
                  begin = time.perf_counter()
                  outputs = regressor.run(None, feeds)
                  elapsed = time.perf_counter() - begin
                  predictions = dict(zip([item.name for item in regressor.get_outputs()], outputs))
                  for name, shape in {'mhr_params': (1, 204), 'shape_params': (1, 45)}.items():
                      if name not in predictions or predictions[name].shape != shape or not np.isfinite(predictions[name]).all():
                          raise RuntimeError(f'Invalid or missing output {name}')
                  return {'outputs': {k: list(v.shape) for k, v in predictions.items()},
                          'first_call_cpu_seconds': elapsed, 'input': 'synthetic zero tensor; not an accuracy test'}
              stage('Bildmodell CPU und Schnittstelle', check_regressor)
              archive = ROOT / 'mhr-assets.zip'
              stage('Download Körpermodell', lambda: download(
                  'https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip',
                  archive, 4 * 1024**3))
              decoder_path = ROOT / 'mhr_model.pt'
          
              def extract_decoder():
                  with zipfile.ZipFile(archive) as bundle:
                      info = bundle.getinfo('assets/mhr_model.pt')
                      if info.file_size > 2 * 1024**3:
                          raise RuntimeError('Decoder exceeds diagnostic size limit')
                      with bundle.open(info) as source, decoder_path.open('wb') as target:
                          shutil.copyfileobj(source, target)
                      (ROOT / 'MHR-LICENSE.txt').write_bytes(bundle.read('assets/LICENSE.txt'))
                      licenses = [name for name in bundle.namelist() if Path(name).name.upper().startswith('LICENSE')]
                      return {'member': info.filename, 'bytes': info.file_size, 'license_members': licenses,
                              'sha256': hashlib.file_digest(decoder_path.open('rb'), 'sha256').hexdigest()}
              stage('Decoder aus offizieller Veröffentlichung', extract_decoder)
              archive.unlink()
              decoder = None
              neutral = (torch.zeros(1, 45), torch.zeros(1, 204), torch.zeros(1, 72))
              changed = tuple(t.clone() for t in neutral)
              changed[0][0, 0] = .5
              pose_changed = tuple(t.clone() for t in neutral)
              pose_changed[1][0, 6] = .1
              torch.manual_seed(42)
              cases = (neutral, changed, pose_changed) + tuple(
                  (torch.randn(1,45)*.3, torch.randn(1,204)*.04, torch.randn(1,72)*.01)
                  for _ in range(9))
              reference = []
          
              def check_decoder():
                  nonlocal decoder
                  decoder = torch.jit.load(str(decoder_path), map_location='cpu').eval()
                  faces = decoder.character_torch.mesh.faces.detach().cpu().numpy()
                  if faces.shape != (36874, 3) or not np.issubdtype(faces.dtype, np.integer):
                      raise RuntimeError('Unexpected MHR triangle topology')
                  if int(faces.min()) < 0 or int(faces.max()) >= 18439:
                      raise RuntimeError('MHR triangle indices do not match decoder vertices')
                  (ROOT / 'mesh-faces.u16').write_bytes(faces.astype('<u2').tobytes())
                  with torch.inference_mode():
                      for inputs in cases:
                          result = decoder(*inputs)
                          vertices = result[0].detach().cpu().numpy()
                          if vertices.ndim != 3 or vertices.shape[0] != 1 or vertices.shape[-1] != 3 or vertices.shape[1] < 500:
                              raise RuntimeError(f'Invalid mesh dimensions {vertices.shape}')
                          if not np.isfinite(vertices).all():
                              raise RuntimeError('Nonfinite mesh vertices')
                          reference.append(vertices)
                  delta = float(np.max(np.abs(reference[0] - reference[1])))
                  if delta <= 1e-7:
                      raise RuntimeError('Shape perturbation has no observable effect')
                  return {'vertices_shape': list(reference[0].shape), 'shape_perturbation_max_delta_native_units': delta}
              stage('Vollständiger Decoder CPU', check_decoder)
              target = ROOT / 'mhr_decoder.onnx'
          
              export_model = None
              point_weights = None
          
              def prepare_export():
                  nonlocal export_model
                  # Source-backed eager tensor implementation; no nested frozen ScriptModule.
                  # Pose correctives remain enabled and are checked against the official model.
                  export_model = CompactMHR(decoder).eval()
                  errors = []
                  with torch.no_grad():
                      for inputs, expected in zip(cases, reference):
                          got = export_model(*inputs).detach().cpu().numpy()
                          np.testing.assert_allclose(got, expected, rtol=1e-4, atol=1e-3)
                          errors.append(float(np.max(np.abs(got-expected))))
                  return {'original_forward_schema': str(decoder.forward.schema),
                          'checked_cases': len(cases), 'output': 'vertices only',
                          'max_abs_errors_native_units': errors, 'pose_correctives_enabled': True,
                          'adapter': 'source-backed CompactMHR; v1.0.1 asset fingerprint checked'}
              stage('Decoder für Export vorbereiten und gegenprüfen', prepare_export)
          
              def export_decoder():
                  nonlocal point_weights
                  source = 'https://raw.githubusercontent.com/Naturalpad-studio/InstantHMR/e125a1e8427739c40439f8d2eb66a924c742a178/'
                  map_path = ROOT / 'mhr_j127_to_kp70.npy'
                  download(source + 'instanthmr_distill_train/assets/mhr_j127_to_kp70.npy', map_path, 100000)
                  download(source + 'LICENSE', ROOT / 'InstantHMR-SOURCE-LICENSE.txt', 50000)
                  point_weights = np.load(map_path, allow_pickle=False)
                  # Fixed batch 1; neither a mobile benchmark nor an accuracy claim.
                  with torch.no_grad():
                      torch.onnx.export(export_model, neutral, str(target), opset_version=17, dynamo=False,
                                        input_names=['identity', 'pose', 'expression'],
                                        output_names=['vertices'], do_constant_folding=True)
                  add_decoder_points(target, point_weights)
                  export_pose_only(target, ROOT / 'mhr_pose.onnx')
                  onnx.checker.check_model(str(target))
                  if target.stat().st_size > 80 * 1024**2:
                      raise RuntimeError('Compact decoder size regression')
                  return {'bytes': target.stat().st_size, 'batch': 1, 'opset': 17,
                          'zero_blocks_omitted': 34, 'quantized_or_pruned': False}
              stage('Decoder ONNX-Export', export_decoder)
          
              def parity():
                  session = ort.InferenceSession(str(target), sess_options=options, providers=['CPUExecutionProvider'])
                  pose_session = ort.InferenceSession(str(ROOT / 'mhr_pose.onnx'), sess_options=options, providers=['CPUExecutionProvider'])
                  pose_inputs = {item.name for item in pose_session.get_inputs()}
                  input_names = {item.name for item in session.get_inputs()}
                  errors = []
                  point_errors = []
                  for inputs, expected in zip(cases, reference):
                      feeds = {name: value.numpy() for name, value in zip(['identity', 'pose', 'expression'], inputs)
                               if name in input_names}
                      got, points = session.run(['vertices', 'decoder_joints'], feeds)
                      np.testing.assert_allclose(got, expected, rtol=1e-4, atol=1e-3)
                      with torch.inference_mode():
                          skeleton = decoder(*inputs)[1].detach().cpu().numpy()[..., :3]
                      expected_points = np.einsum('kj,bjc->bkc', point_weights, skeleton * np.array([.01, -.01, -.01], np.float32))
                      if points.shape != (1, 70, 3) or not np.isfinite(points).all():
                          raise RuntimeError('Invalid decoder body points')
                      np.testing.assert_allclose(points, expected_points, rtol=1e-4, atol=1e-5)
                      pose_points = pose_session.run(['decoder_joints'], {k: v for k, v in feeds.items() if k in pose_inputs})[0]
                      np.testing.assert_allclose(pose_points, points, rtol=1e-4, atol=1e-5)
                      point_errors.append(float(np.max(np.abs(points - expected_points))))
                      errors.append(float(np.max(np.abs(got - expected))))
                  # Also check that image-regressor outputs can drive the decoder, without assessing anatomy.
                  feeds = {'identity': predictions['shape_params'].astype(np.float32),
                           'pose': predictions['mhr_params'].astype(np.float32),
                           'expression': np.zeros((1, 72), np.float32)}
                  got = session.run(['vertices'], {k: v for k, v in feeds.items() if k in input_names})[0]
                  if not np.isfinite(got).all():
                      raise RuntimeError('Regressor-to-decoder chain yields nonfinite vertices')
                  with torch.no_grad():
                      expected_chain = decoder(torch.from_numpy(feeds['identity']), torch.from_numpy(feeds['pose']),
                                               torch.from_numpy(feeds['expression']))[0].numpy()
                  np.testing.assert_allclose(got, expected_chain, rtol=1e-4, atol=1e-3)
                  (ROOT / 'synthetic-reference.f32').write_bytes(expected_chain.astype('<f4').tobytes())
                  return {'decoder_points_shape': list(points.shape), 'max_abs_point_errors_metres': point_errors, 'checked_cases': len(cases), 'max_abs_errors_native_units': errors, 'regressor_to_mesh_shape': list(got.shape),
                          'tolerance': 'rtol=1e-4, atol=1e-3 in MHR native units; export parity, not body accuracy'}
              stage('Numerische Exportprüfung und Modellkette', parity)
              asset_dir = os.environ.get('BODY3D_ASSET_DIR')
              if asset_dir:
                  def package_assets():
                      destination = Path(asset_dir)
                      destination.mkdir(parents=True, exist_ok=True)
                      names = ['instanthmr.onnx', 'mhr_decoder.onnx', 'synthetic-reference.f32', 'MHR-LICENSE.txt', 'mesh-faces.u16', 'InstantHMR-SOURCE-LICENSE.txt', 'mhr_pose.onnx']
                      for name in names:
                          shutil.copyfile(regressor_path if name == 'instanthmr.onnx' else ROOT / name, destination / name)
                      (destination / 'SAM-LICENSE.txt').write_text(SAM_LICENSE, encoding='utf-8')
                      (destination / 'NOTICE.txt').write_text(
                          'InstantHMR weights: momolesang/InstantHMR, pinned release 3504446fc31e7f76fdb1cd7e463189e7cf0fdd0f; SAM License.\n'
                          'MHR v1.0.1: Copyright (c) Meta Platforms, Inc. and affiliates; Apache License 2.0.\n'
                          'Modified for Playboy Archiv: equivalent packed pose-corrective blocks and ONNX export; no quantization.\n'
                          'InstantHMR internal float16 tensor values exactly promoted to float32; execution casts/types updated to float32.\n'
                          'Decoder keypoints: InstantHMR mhr_j127_to_kp70.npy, e125a1e8427739c40439f8d2eb66a924c742a178; source Apache-2.0 licence included.\n'
                          'Synthetic technical test only. Not a body-measurement accuracy claim.\n', encoding='utf-8')
                      manifest = {name: {'bytes': (destination / name).stat().st_size,
                                  'sha256': hashlib.sha256((destination / name).read_bytes()).hexdigest()} for name in names}
                      manifest['diagnostic_revision'] = 3
                      manifest['image_compute'] = 'float32'
                      manifest['photo_revision'] = 1
                      manifest['decoder_points_revision'] = 1
                      manifest['pose_refine_revision'] = 1
                      manifest['decoder_point_map_sha256'] = 'd0a64adcec183a892167ea1df1657a8c819fcddbc721f6b8a46f6336ea90292a'
                      manifest['synthetic_inputs'] = {
                          'identity': predictions['shape_params'][0].astype(np.float32).tolist(),
                          'pose': predictions['mhr_params'][0].astype(np.float32).tolist(),
                      }
                      payload = json.dumps(manifest, indent=2)
                      restored = json.loads(payload)['synthetic_inputs']
                      np.testing.assert_array_equal(np.asarray(restored['identity'], dtype=np.float32), predictions['shape_params'][0])
                      np.testing.assert_array_equal(np.asarray(restored['pose'], dtype=np.float32), predictions['mhr_params'][0])
                      (destination / 'manifest.json').write_text(payload, encoding='utf-8')
                      return {'files': manifest, 'scope': 'APK assets; synthetic CPU test only'}
                  stage('Android-Testdateien bereitstellen', package_assets)
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  REPORT['result'] = 'failed'
                  REPORT['failure'] = str(error)
                  flush()
                  raise
              else:
                  REPORT['result'] = 'cpu_export_checks_passed_android_not_tested'
                  flush()
          PY
      - name: Ergebnis in Zusammenfassung anzeigen
        if: always()
        run: |
          if [ -f model-preflight/report.md ]; then
            cat model-preflight/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Prüfung vor Erstellung des Berichts abgebrochen; bitte Schrittprotokoll prüfen.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Nur Diagnosebericht bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Techniktest-Bericht-${{ github.run_number }}
          path: |
            model-preflight/report.json
            model-preflight/report.md
          if-no-files-found: warn
          retention-days: 7

