name: 3D-Techniktest (keine APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prüfwerkzeuge installieren
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 onnx==1.18.0 onnxruntime==1.31.0
      - name: Modelle und Decoder mit künstlichen Eingaben prüfen
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          os.environ['ORT_DISABLE_TELEMETRY'] = '1'
          from pathlib import Path
          import platform
          import shutil
          import time
          import traceback
          import urllib.request
          import zipfile
          
          # Experimental source-backed decoder adapter for the official MHR v1.0.1 checkpoint.
          # Adapted from Meta MHR tensor definitions (Apache-2.0); not an accuracy claim.
          import torch
          
          
          def qmul(a,b):
           av,aw=a[...,:3],a[...,3:];bv,bw=b[...,:3],b[...,3:]
           return torch.cat((aw*bv+bw*av+torch.cross(av,bv,dim=-1),aw*bw-(av*bv).sum(-1,keepdim=True)),-1)
          
          
          def qrotate(q,v):
           q=q/torch.linalg.vector_norm(q,dim=-1,keepdim=True).clamp_min(1e-12)
           xyz=q[...,:3];uv=torch.cross(xyz,v,dim=-1)
           return v+2*(q[...,3:]*uv+torch.cross(xyz,uv,dim=-1))
          
          
          def compose(a,b):
           q=qmul(a[...,3:7],b[...,3:7]);q=q/torch.linalg.vector_norm(q,dim=-1,keepdim=True).clamp_min(1e-12)
           return torch.cat((a[...,:3]+a[...,7:]*qrotate(a[...,3:7],b[...,:3]),q,a[...,7:]*b[...,7:]),-1)
          
          
          class CompactMHR(torch.nn.Module):
           def __init__(self,original):
            super().__init__();c=original.character_torch;s=c.skeleton;l=c.linear_blend_skinning
            def buf(name,value): self.register_buffer(name,value.detach())
            buf('base',c.blend_shape.base_shape);buf('identity_dirs',c.blend_shape.shape_vectors)
            buf('face_dirs',original.face_expressions_model.shape_vectors)
            buf('parameter_map',c.parameter_transform.parameter_transform)
            buf('offsets',s.joint_translation_offsets);buf('prerot',s.joint_prerotations)
            buf('invbind',l.inverse_bind_pose);buf('skinidx',l.skin_indices_flattened.long())
            buf('vertidx',l.vert_indices_flattened);buf('weights',l.skin_weights_flattened)
            self.parents=s.joint_parents.tolist()
            sparse=original.pose_correctives_model.pose_dirs_predictor._modules['0']
            buf('corrective_a',torch.sparse_coo_tensor(sparse.sparse_indices,sparse.sparse_weight,tuple(sparse.sparse_shape)).to_dense())
            matrix=original.pose_correctives_model.pose_dirs_predictor._modules['2'].weight
            self.active_blocks=[]
            for j in range(125):
             block=matrix[:,j*24:(j+1)*24]
             rows=(block!=0).any(dim=1).nonzero().flatten()
             if rows.numel():
              self.active_blocks.append(j)
              buf('corrective_rows_'+str(j),rows)
              buf('corrective_block_'+str(j),block.index_select(0,rows).contiguous())
           def forward(self,identity,pose,expression):
            rest=self.base+torch.einsum('nvd,bn->bvd',self.identity_dirs,identity)+torch.einsum('nvd,bn->bvd',self.face_dirs,expression)
            jp=torch.nn.functional.linear(torch.cat((pose,torch.zeros_like(identity)),-1),self.parameter_map).reshape(-1,127,7)
            angles=jp[...,3:6];cs=torch.cos(angles*.5);sn=torch.sin(angles*.5)
            cx,cy,cz=cs.unbind(-1);sx,sy,sz=sn.unbind(-1)
            q=torch.stack((sx*cy*cz-cx*sy*sz,cx*sy*cz+sx*cy*sz,cx*cy*sz-sx*sy*cz,cx*cy*cz+sx*sy*sz),-1)
            q=qmul(self.prerot.unsqueeze(0).expand_as(q),q)
            local=torch.cat((jp[...,:3]+self.offsets,q,torch.exp(jp[...,6:7]*0.69314718246459961)),-1).double()
            states=[]
            for j,parent in enumerate(self.parents):
             states.append(local[:,j] if parent<0 else compose(states[parent],local[:,j]))
            global_state=torch.stack(states,1).float()
            # Corrective features: first two columns of Rz*Ry*Rx, excluding the two global joints.
            co=torch.cos(angles[:,2:]);si=torch.sin(angles[:,2:])
            cx,cy,cz=co.unbind(-1);sx,sy,sz=si.unbind(-1)
            features=torch.stack((cy*cz-1,cy*sz,-sy,-cx*sz+sx*sy*cz,cx*cz+sx*sy*sz-1,sx*cy),-1).flatten(1)
            hidden=torch.relu(torch.nn.functional.linear(features,self.corrective_a))
            offsets=torch.zeros_like(rest).flatten(1)
            for j in self.active_blocks:
             rows=getattr(self,'corrective_rows_'+str(j))
             block=getattr(self,'corrective_block_'+str(j))
             values=torch.nn.functional.linear(hidden[:,j*24:(j+1)*24],block)
             offsets=offsets.scatter_add(1,rows.unsqueeze(0).expand_as(values),values)
            offsets=offsets.reshape(-1,18439,3)
            rest=rest+offsets
            transforms=compose(global_state,self.invbind.unsqueeze(0).expand_as(global_state))
            influence=transforms.index_select(1,self.skinidx)
            points=rest.index_select(1,self.vertidx)
            moved=influence[...,:3]+influence[...,7:]*qrotate(influence[...,3:7],points)
            weighted=moved*self.weights[None,:,None]
            indices=self.vertidx[None,:,None].expand_as(weighted)
            return torch.zeros_like(rest).scatter_add(1,indices,weighted)
          
          
          import onnx,numpy as np
          from onnx import numpy_helper,TensorProto,AttributeProto
          
          def promote_regressor(source,target):
              model=onnx.load(str(source))
              counts={'float16_tensors':0,'float16_types':0,'float16_casts':0}
              def tensor(value):
                  if value.data_type==TensorProto.FLOAT16:
                      converted=numpy_helper.from_array(numpy_helper.to_array(value).astype(np.float32),name=value.name)
                      # Every finite half value is exactly representable in float32.
                      np.testing.assert_array_equal(numpy_helper.to_array(converted).astype(np.float16),numpy_helper.to_array(value))
                      value.CopyFrom(converted);counts['float16_tensors']+=1
              def types(value):
                  if value.HasField('tensor_type') and value.tensor_type.elem_type==TensorProto.FLOAT16:
                      value.tensor_type.elem_type=TensorProto.FLOAT;counts['float16_types']+=1
                  if value.HasField('sequence_type'):types(value.sequence_type.elem_type)
                  if value.HasField('optional_type'):types(value.optional_type.elem_type)
              def nodes(values):
                  for node in values:
                      for attr in node.attribute:
                          if node.op_type=='Cast' and attr.name=='to' and attr.i==TensorProto.FLOAT16:
                              attr.i=TensorProto.FLOAT;counts['float16_casts']+=1
                          if attr.type==AttributeProto.TENSOR:tensor(attr.t)
                          elif attr.type==AttributeProto.TENSORS:
                              for value in attr.tensors:tensor(value)
                          elif attr.type==AttributeProto.GRAPH:graph(attr.g)
                          elif attr.type==AttributeProto.GRAPHS:
                              for value in attr.graphs:graph(value)
              def graph(value):
                  for item in value.initializer:tensor(item)
                  for item in value.sparse_initializer:tensor(item.values)
                  for item in list(value.input)+list(value.output)+list(value.value_info):types(item.type)
                  nodes(value.node)
              graph(model.graph)
              for function in model.functions:
                  nodes(function.node)
                  for item in function.value_info:types(item.type)
              if not counts['float16_tensors']:raise RuntimeError('Expected half-precision source tensors missing')
              for value in model.graph.initializer:
                  if value.data_type==TensorProto.FLOAT16:raise RuntimeError('Half-precision initializer remains')
              def reject_half(message):
                  if isinstance(message,TensorProto) and message.data_type==TensorProto.FLOAT16:
                      raise RuntimeError('Half-precision tensor remains')
                  if isinstance(message,onnx.TypeProto) and message.HasField('tensor_type') and message.tensor_type.elem_type==TensorProto.FLOAT16:
                      raise RuntimeError('Half-precision value type remains')
                  if isinstance(message,onnx.NodeProto) and message.op_type=='Cast':
                      if any(a.name=='to' and a.i==TensorProto.FLOAT16 for a in message.attribute):
                          raise RuntimeError('Half-precision execution cast remains')
                  for field,value in message.ListFields():
                      if field.message_type is not None:
                          if (field.is_repeated if hasattr(field, 'is_repeated') else field.label==field.LABEL_REPEATED):
                              for child in value:reject_half(child)
                          else:reject_half(value)
              reject_half(model)
              onnx.checker.check_model(model)
              onnx.save_model(model,str(target))
              return counts
          
          
