name: 3D-Techniktest (keine APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prüfwerkzeuge installieren
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 onnx==1.18.0 onnxruntime==1.31.0
      - name: Modelle und Decoder mit künstlichen Eingaben prüfen
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import time
          import traceback
          import urllib.request
          import zipfile
          
          # Experimental source-backed decoder adapter for the official MHR v1.0.1 checkpoint.
          # Adapted from Meta MHR tensor definitions (Apache-2.0); not an accuracy claim.
          import torch
          
          
          def qmul(a,b):
           av,aw=a[...,:3],a[...,3:];bv,bw=b[...,:3],b[...,3:]
           return torch.cat((aw*bv+bw*av+torch.cross(av,bv,dim=-1),aw*bw-(av*bv).sum(-1,keepdim=True)),-1)
          
          
          def qrotate(q,v):
           q=q/torch.linalg.vector_norm(q,dim=-1,keepdim=True).clamp_min(1e-12)
           xyz=q[...,:3];uv=torch.cross(xyz,v,dim=-1)
           return v+2*(q[...,3:]*uv+torch.cross(xyz,uv,dim=-1))
          
          
          def compose(a,b):
           q=qmul(a[...,3:7],b[...,3:7]);q=q/torch.linalg.vector_norm(q,dim=-1,keepdim=True).clamp_min(1e-12)
           return torch.cat((a[...,:3]+a[...,7:]*qrotate(a[...,3:7],b[...,:3]),q,a[...,7:]*b[...,7:]),-1)
          
          
          class EagerMHR(torch.nn.Module):
           def __init__(self,original):
            super().__init__();c=original.character_torch;s=c.skeleton;l=c.linear_blend_skinning
            def buf(name,value): self.register_buffer(name,value.detach())
            buf('base',c.blend_shape.base_shape);buf('identity_dirs',c.blend_shape.shape_vectors)
            buf('face_dirs',original.face_expressions_model.shape_vectors)
            buf('parameter_map',c.parameter_transform.parameter_transform)
            buf('offsets',s.joint_translation_offsets);buf('prerot',s.joint_prerotations)
            buf('invbind',l.inverse_bind_pose);buf('skinidx',l.skin_indices_flattened.long())
            buf('vertidx',l.vert_indices_flattened);buf('weights',l.skin_weights_flattened)
            self.parents=s.joint_parents.tolist()
            sparse=original.pose_correctives_model.pose_dirs_predictor._modules['0']
            buf('corrective_a',torch.sparse_coo_tensor(sparse.sparse_indices,sparse.sparse_weight,tuple(sparse.sparse_shape)).to_dense())
            buf('corrective_b',original.pose_correctives_model.pose_dirs_predictor._modules['2'].weight)
           def forward(self,identity,pose,expression):
            rest=self.base+torch.einsum('nvd,bn->bvd',self.identity_dirs,identity)+torch.einsum('nvd,bn->bvd',self.face_dirs,expression)
            jp=torch.nn.functional.linear(torch.cat((pose,torch.zeros_like(identity)),-1),self.parameter_map).reshape(-1,127,7)
            angles=jp[...,3:6];cs=torch.cos(angles*.5);sn=torch.sin(angles*.5)
            cx,cy,cz=cs.unbind(-1);sx,sy,sz=sn.unbind(-1)
            q=torch.stack((sx*cy*cz-cx*sy*sz,cx*sy*cz+sx*cy*sz,cx*cy*sz-sx*sy*cz,cx*cy*cz+sx*sy*sz),-1)
            q=qmul(self.prerot.unsqueeze(0).expand_as(q),q)
            local=torch.cat((jp[...,:3]+self.offsets,q,torch.exp(jp[...,6:7]*0.69314718246459961)),-1).double()
            states=[]
            for j,parent in enumerate(self.parents):
             states.append(local[:,j] if parent<0 else compose(states[parent],local[:,j]))
            global_state=torch.stack(states,1).float()
            # Corrective features: first two columns of Rz*Ry*Rx, excluding the two global joints.
            co=torch.cos(angles[:,2:]);si=torch.sin(angles[:,2:])
            cx,cy,cz=co.unbind(-1);sx,sy,sz=si.unbind(-1)
            features=torch.stack((cy*cz-1,cy*sz,-sy,-cx*sz+sx*sy*cz,cx*cz+sx*sy*sz-1,sx*cy),-1).flatten(1)
            offsets=torch.nn.functional.linear(torch.relu(torch.nn.functional.linear(features,self.corrective_a)),self.corrective_b).reshape(-1,18439,3)
            rest=rest+offsets
            transforms=compose(global_state,self.invbind.unsqueeze(0).expand_as(global_state))
            influence=transforms.index_select(1,self.skinidx)
            points=rest.index_select(1,self.vertidx)
            moved=influence[...,:3]+influence[...,7:]*qrotate(influence[...,3:7],points)
            weighted=moved*self.weights[None,:,None]
            indices=self.vertidx[None,:,None].expand_as(weighted)
            return torch.zeros_like(rest).scatter_add(1,indices,weighted)
          
          
          ROOT = Path('model-preflight')
          ROOT.mkdir(exist_ok=True)
          REPORT = {'scope': 'Synthetic CPU/export test; no photos, no Android benchmark, no measurements.',
                    'android_verified': False, 'measurement_accuracy_verified': False, 'test_revision': 3, 'stages': []}
          
          def download(url, target, max_bytes):
              request = urllib.request.Request(url, headers={'User-Agent': 'PlayboyArchiv-3D-Preflight/1.0'})
              count = 0
              digest = hashlib.sha256()
              with urllib.request.urlopen(request, timeout=60) as response, target.open('wb') as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > max_bytes:
                          raise RuntimeError('Download exceeds diagnostic size limit')
                      output.write(chunk)
                      digest.update(chunk)
              if not count:
                  raise RuntimeError('Empty download')
              expected = {
                  'instanthmr.onnx': 'f717558094f57d7c9cd084d7981874dbcc3f08e7308501eb98c12844e2cce3b7',
                  'mhr-assets.zip': 'e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94',
              }.get(target.name)
              if expected and digest.hexdigest() != expected:
                  raise RuntimeError('Download checksum differs from verified first run')
              return {'url': url, 'bytes': count, 'sha256': digest.hexdigest()}
          
          def flush():
              (ROOT / 'report.json').write_text(json.dumps(REPORT, indent=2), encoding='utf-8')
              lines = ['# 3D-Techniktest', '', 'Nur künstliche Eingaben. Keine Archivfotos, keine Körpermaße.', '',
                       '| Stufe | Ergebnis |', '|---|---|']
              for row in REPORT['stages']:
                  lines.append('| ' + row['name'] + ' | ' + row['status'] + ' |')
              lines += ['', '**Android auf dem S25: nicht getestet. Maßgenauigkeit: nicht getestet.**', '',
                        'Details und Fehler stehen in report.json. Ein grüner Lauf belegt nur diese CPU-/Exportprüfungen.']
              (ROOT / 'report.md').write_text('\n'.join(lines), encoding='utf-8')
          
          
          def stage(name, fn):
              row = {'name': name, 'status': 'running'}
              REPORT['stages'].append(row)
              flush()
              try:
                  row['details'] = fn()
                  row['status'] = 'passed'
                  print(json.dumps(row, ensure_ascii=False), flush=True)
              except Exception as error:
                  row['status'] = 'failed'
                  row['error'] = str(error)
                  print(json.dumps(row, ensure_ascii=False), flush=True)
                  row['traceback'] = traceback.format_exc()
                  raise
              finally:
                  flush()
          
          
          def main():
              import numpy as np
              import onnx
              import onnxruntime as ort
              import torch
              torch.set_num_threads(2)
              REPORT['environment'] = {'python': platform.python_version(), 'torch': torch.__version__,
                                       'onnx': onnx.__version__, 'onnxruntime': ort.__version__}
              flush()
              revision = '3504446fc31e7f76fdb1cd7e463189e7cf0fdd0f'
              regressor_path = ROOT / 'instanthmr.onnx'
              stage('Download Bildmodell', lambda: download(
                  f'https://huggingface.co/momolesang/InstantHMR/resolve/{revision}/instanthmr.onnx',
                  regressor_path, 512 * 1024**2))
              options = ort.SessionOptions()
              options.intra_op_num_threads = 2
              regressor = None
              predictions = None
          
              def check_regressor():
                  nonlocal regressor, predictions
                  regressor = ort.InferenceSession(str(regressor_path), sess_options=options,
                                                  providers=['CPUExecutionProvider'])
                  inputs = {item.name: item for item in regressor.get_inputs()}
                  if set(inputs) != {'image', 'cliff_cond'}:
                      raise RuntimeError(f'Unexpected inputs: {list(inputs)}')
                  feeds = {'image': np.zeros((1, 3, 224, 224), np.float32),
                           'cliff_cond': np.array([[0., 0., .8]], np.float32)}
                  begin = time.perf_counter()
                  outputs = regressor.run(None, feeds)
                  elapsed = time.perf_counter() - begin
                  predictions = dict(zip([item.name for item in regressor.get_outputs()], outputs))
                  for name, shape in {'mhr_params': (1, 204), 'shape_params': (1, 45)}.items():
                      if name not in predictions or predictions[name].shape != shape or not np.isfinite(predictions[name]).all():
                          raise RuntimeError(f'Invalid or missing output {name}')
                  return {'outputs': {k: list(v.shape) for k, v in predictions.items()},
                          'first_call_cpu_seconds': elapsed, 'input': 'synthetic zero tensor; not an accuracy test'}
              stage('Bildmodell CPU und Schnittstelle', check_regressor)
              archive = ROOT / 'mhr-assets.zip'
              stage('Download Körpermodell', lambda: download(
                  'https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip',
                  archive, 4 * 1024**3))
              decoder_path = ROOT / 'mhr_model.pt'
          
              def extract_decoder():
                  with zipfile.ZipFile(archive) as bundle:
                      info = bundle.getinfo('assets/mhr_model.pt')
                      if info.file_size > 2 * 1024**3:
                          raise RuntimeError('Decoder exceeds diagnostic size limit')
                      with bundle.open(info) as source, decoder_path.open('wb') as target:
                          shutil.copyfileobj(source, target)
                      licenses = [name for name in bundle.namelist() if Path(name).name.upper().startswith('LICENSE')]
                      return {'member': info.filename, 'bytes': info.file_size, 'license_members': licenses,
                              'sha256': hashlib.file_digest(decoder_path.open('rb'), 'sha256').hexdigest()}
              stage('Decoder aus offizieller Veröffentlichung', extract_decoder)
              archive.unlink()
              decoder = None
              neutral = (torch.zeros(1, 45), torch.zeros(1, 204), torch.zeros(1, 72))
              changed = tuple(t.clone() for t in neutral)
              changed[0][0, 0] = .5
              pose_changed = tuple(t.clone() for t in neutral)
              pose_changed[1][0, 6] = .1
              torch.manual_seed(42)
              cases = (neutral, changed, pose_changed) + tuple(
                  (torch.randn(1,45)*.3, torch.randn(1,204)*.04, torch.randn(1,72)*.01)
                  for _ in range(9))
              reference = []
          
              def check_decoder():
                  nonlocal decoder
                  decoder = torch.jit.load(str(decoder_path), map_location='cpu').eval()
                  with torch.inference_mode():
                      for inputs in cases:
                          result = decoder(*inputs)
                          vertices = result[0].detach().cpu().numpy()
                          if vertices.ndim != 3 or vertices.shape[0] != 1 or vertices.shape[-1] != 3 or vertices.shape[1] < 500:
                              raise RuntimeError(f'Invalid mesh dimensions {vertices.shape}')
                          if not np.isfinite(vertices).all():
                              raise RuntimeError('Nonfinite mesh vertices')
                          reference.append(vertices)
                  delta = float(np.max(np.abs(reference[0] - reference[1])))
                  if delta <= 1e-7:
                      raise RuntimeError('Shape perturbation has no observable effect')
                  return {'vertices_shape': list(reference[0].shape), 'shape_perturbation_max_delta_native_units': delta}
              stage('Vollständiger Decoder CPU', check_decoder)
              target = ROOT / 'mhr_decoder.onnx'
          
              export_model = None
          
              def prepare_export():
                  nonlocal export_model
                  # Source-backed eager tensor implementation; no nested frozen ScriptModule.
                  # Pose correctives remain enabled and are checked against the official model.
                  export_model = EagerMHR(decoder).eval()
                  errors = []
                  with torch.no_grad():
                      for inputs, expected in zip(cases, reference):
                          got = export_model(*inputs).detach().cpu().numpy()
                          np.testing.assert_allclose(got, expected, rtol=1e-4, atol=1e-3)
                          errors.append(float(np.max(np.abs(got-expected))))
                  return {'original_forward_schema': str(decoder.forward.schema),
                          'checked_cases': len(cases), 'output': 'vertices only',
                          'max_abs_errors_native_units': errors, 'pose_correctives_enabled': True,
                          'adapter': 'source-backed EagerMHR; v1.0.1 asset fingerprint checked'}
              stage('Decoder für Export vorbereiten und gegenprüfen', prepare_export)
          
              def export_decoder():
                  # Fixed batch 1; neither a mobile benchmark nor an accuracy claim.
                  with torch.no_grad():
                      torch.onnx.export(export_model, neutral, str(target), opset_version=17, dynamo=False,
                                        input_names=['identity', 'pose', 'expression'],
                                        output_names=['vertices'], do_constant_folding=True)
                  onnx.checker.check_model(str(target))
                  return {'bytes': target.stat().st_size, 'batch': 1, 'opset': 17}
              stage('Decoder ONNX-Export', export_decoder)
          
              def parity():
                  session = ort.InferenceSession(str(target), sess_options=options, providers=['CPUExecutionProvider'])
                  input_names = {item.name for item in session.get_inputs()}
                  errors = []
                  for inputs, expected in zip(cases, reference):
                      feeds = {name: value.numpy() for name, value in zip(['identity', 'pose', 'expression'], inputs)
                               if name in input_names}
                      got = session.run(['vertices'], feeds)[0]
                      np.testing.assert_allclose(got, expected, rtol=1e-4, atol=1e-3)
                      errors.append(float(np.max(np.abs(got - expected))))
                  # Also check that image-regressor outputs can drive the decoder, without assessing anatomy.
                  feeds = {'identity': predictions['shape_params'].astype(np.float32),
                           'pose': predictions['mhr_params'].astype(np.float32),
                           'expression': np.zeros((1, 72), np.float32)}
                  got = session.run(['vertices'], {k: v for k, v in feeds.items() if k in input_names})[0]
                  if not np.isfinite(got).all():
                      raise RuntimeError('Regressor-to-decoder chain yields nonfinite vertices')
                  with torch.no_grad():
                      expected_chain = decoder(torch.from_numpy(feeds['identity']), torch.from_numpy(feeds['pose']),
                                               torch.from_numpy(feeds['expression']))[0].numpy()
                  np.testing.assert_allclose(got, expected_chain, rtol=1e-4, atol=1e-3)
                  return {'checked_cases': len(cases), 'max_abs_errors_native_units': errors, 'regressor_to_mesh_shape': list(got.shape),
                          'tolerance': 'rtol=1e-4, atol=1e-3 in MHR native units; export parity, not body accuracy'}
              stage('Numerische Exportprüfung und Modellkette', parity)
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  REPORT['result'] = 'failed'
                  REPORT['failure'] = str(error)
                  flush()
                  raise
              else:
                  REPORT['result'] = 'cpu_export_checks_passed_android_not_tested'
                  flush()
          PY
      - name: Ergebnis in Zusammenfassung anzeigen
        if: always()
        run: |
          if [ -f model-preflight/report.md ]; then
            cat model-preflight/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Prüfung vor Erstellung des Berichts abgebrochen; bitte Schrittprotokoll prüfen.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Nur Diagnosebericht bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Techniktest-Bericht-${{ github.run_number }}
          path: |
            model-preflight/report.json
            model-preflight/report.md
          if-no-files-found: warn
          retention-days: 7

