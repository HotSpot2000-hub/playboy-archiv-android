name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install native archive bridge
        run: |
          mkdir -p android/app/src/main/java/de/playboy/archiv
          cp native/ArchiveDirectoryPlugin.java android/app/src/main/java/de/playboy/archiv/ArchiveDirectoryPlugin.java
          cp native/MainActivity.java android/app/src/main/java/de/playboy/archiv/MainActivity.java

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Playboy Archiv app icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("assets/app-icon/app-icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          base = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              out = base / folder
              out.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out / "ic_launcher.png")
              icon.save(out / "ic_launcher_round.png")

          adaptive = base / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  p = adaptive / name
                  if p.exists():
                      p.unlink()
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
        
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Playboy-Archiv-Build-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Playboy-Archiv-Build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/Playboy-Archiv-Build-${{ github.run_number }}.apk
